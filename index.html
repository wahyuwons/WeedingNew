<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heritage Series – Aruna</title>
  <meta name="description" content="Heritage Series – Aruna digital wedding invitation">
  <style>
    :root {
      color-scheme: light;
      --aruna-ivory: #f4f0e7;
      --aruna-ink: #4e493e;
      --aruna-gold: #9e9160;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--aruna-ivory);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--aruna-ink);
    }

    .aruna-loader {
      display: grid;
      place-items: center;
      gap: 18px;
      min-height: 100vh;
      width: 100%;
      padding: 32px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(181, 170, 124, .18), transparent 30%),
        linear-gradient(180deg, #f7f4ed 0%, #ece6da 100%);
    }

    .aruna-loader__mark {
      width: 54px;
      height: 54px;
      border: 1px solid rgba(132, 125, 74, .28);
      border-top-color: var(--aruna-gold);
      border-radius: 50%;
      animation: aruna-spin 1s linear infinite;
    }

    .aruna-loader__label {
      margin: 0;
      font-size: 12px;
      letter-spacing: .26em;
      text-transform: uppercase;
    }

    .aruna-loader__error {
      display: none;
      max-width: 520px;
      margin: 0;
      font: 14px/1.7 Arial, sans-serif;
    }

    .aruna-loader.is-error .aruna-loader__mark,
    .aruna-loader.is-error .aruna-loader__label {
      display: none;
    }

    .aruna-loader.is-error .aruna-loader__error {
      display: block;
    }

    @keyframes aruna-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="aruna-loader" id="arunaLoader" aria-live="polite">
    <span class="aruna-loader__mark" aria-hidden="true"></span>
    <p class="aruna-loader__label">Preparing invitation</p>
    <p class="aruna-loader__error" id="arunaLoaderError"></p>
  </main>

  <noscript>JavaScript harus diaktifkan untuk membuka undangan ini.</noscript>
  <script src="./aruna-loader.js"></script>
</body>
</html>
